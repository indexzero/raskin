[tools]
rust = "1.96.0"
usage = "7.1.1"
hk = "1.50.0"
"github:axodotdev/cargo-dist" = "0.32.0"

[tasks.check]
description = "Verify formatting, lint, fixtures, build and generated docs"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo build --workspace --locked",
  "bash scripts/gen-docs.sh --check",
]

[tasks.test]
description = "Run synthetic fixtures; never execute generated files"
run = "cargo test --workspace --locked"

[tasks.build]
run = "cargo build --workspace --locked"

[tasks.docs]
run = "bash scripts/gen-docs.sh"
